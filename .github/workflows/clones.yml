name: Statistiques des clones

# Toutes les heures : relève les clones GitHub des dépôts de code AKM12 et met à jour
# clones.json sur la branche « stats » (lu par https://akm12.com). Pas de commit sans changement.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats-clones
  cancel-in-progress: false

jobs:
  clones:
    runs-on: ubuntu-latest
    steps:
      - name: Script
        uses: actions/checkout@v4
        with:
          path: main

      - name: Branche stats
        uses: actions/checkout@v4
        with:
          ref: stats
          path: stats

      - name: Relevé des clones
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python3 main/scripts/clones.py stats/clones.json

      - name: Publication
        working-directory: stats
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "AKM12"
            git config user.email "273318911+loyal-ac@users.noreply.github.com"
            git add clones.json
            git commit -m "Clones : relevé du $(date -u +%Y-%m-%d\ %H:%M) UTC"
            git push
          fi
